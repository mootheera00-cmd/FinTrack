<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ให้เนื้อหาครอบคลุมถึงบริเวณ notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Android -->
    <meta name="theme-color" content="#FFBF00" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari Standalone (ไม่โชว์ URL bar เมื่อเพิ่มในโฮมสกรีน) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />

    <!-- Icons iOS: 180×180 สำหรับ iPhone และ iPad modern -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Splash screen background color (แสดงก่อน app load) -->
    <meta name="msapplication-navbutton-color" content="#FFBF00" />

    <title>FinTrack</title>
  </head>
  <body class="bg-surface text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
